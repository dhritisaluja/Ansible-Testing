#ansible-playbook -i invfile Playbooks/vault_testing.yml -vv --ask-vault-pass
---
- name: Run AWS Cli Commands On All Servers
  hosts: pvt
  gather_facts: yes
  become: yes
  become_user: root
  serial: 3
  vars:
    user_password: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      35356634396562333432396264663566663864343461643862363837336138383837623262306334
      3164343031346664623966636430373762643861346562390a333035396565343235373632323035
      39366339633765366437373533653763653666663761323437626532646266303062363939336634
      3933376235396131360a373437666436306333613436303861373230373331636539383533303538
      3136

  tasks:
    - name: Create .aws folder 
      shell: mkdir -p /root/.aws
      ignore_errors: yes
    - name: Copy Encrypted File To /tmp #copy the 3 encrypted files from Ansible Controller to the remote servers
      copy:
        src: /tmp/{{item}} #These Encrypted File Must Be Created Prior To Running The Playbook. 
        dest: /tmp/{{item}}
        owner: root
        group: root
        mode: "0600"
      with_items:
        - aws_creds
        - tls.key
        - tls.crt
    - name: Copy Encrypted Credentials File To .aws folder
      copy:
        src: /tmp/aws_creds #This Encrypted File Must Be Created Prior To Running The Playbook.
        dest: /root/.aws/credentials
        owner: root
        group: root
        mode: "0600"
    - name: Check S3 Buckets
      shell: aws s3 ls | cut -d " " -f 3
      register: buckets
    - name: Print Bucket Name
      debug:
        var: buckets
    - name: Get VPCS
      shell: aws ec2 describe-vpcs | jq ".Vpcs[].VpcId" -r
      register: vpcs
    - name: Print VPC ID
      debug:
        var: vpcs

    - name: Ensure pip3 is installed (Debian/Ubuntu)
      apt:
        name: python3-pip
        state: present
      when: ansible_os_family == "Debian"

    - name: Install required Python dependencies
      pip:
        name:
          - boto3
          - botocore
          - passlib
        state: present

    - name: Creating admin "{{item}}" #Creating Users with an Encrypted Password
      user:
        name: "{{item}}"
        state: present
        comment: Admin User "{{item}}"
        groups: root
        shell: /bin/bash
        group: sudo
        # Here, Is Ansible be able to decrypt user_password with the help of /root/vaultpass file?
        password: "{{ '%s' | format(user_password) | regex_replace('\n', '') | password_hash('sha512') }}" 
        password_expire_min: 1
      with_items:
        - Avinash
        - Saikiran
        - Gnane
    - name: Replace Password Authentication To Yes
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PasswordAuthentication no"
        line: PasswordAuthentication yes
        backup: yes
      notify:
        - Restart SSH Service
  handlers:
    - name: Restart SSH Service
      shell: service sshd restart
    - name: Restart elastic-agent
      shell: sudo heartbeat setup && sudo service heartbeat-elastic start
