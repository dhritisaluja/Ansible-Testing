#This playbook automates the deployment of a web page on Nginx servers using templates for dynamic content.
---
- name: Play for Install Nginx on WebServers
  hosts: pvt
  gather_facts: yes              # Gathers system information (facts) from target hosts
  become: yes                    # Executes tasks with elevated privileges (e.g., sudo)
  become_user: root              # Specifies the user to become (root)
  vars:
    #Static Variables
    custom_heading: "Welcome To DevSecOps By Saikiran Pinapathruni"
    custom_para: "We Are Studying Ansible Templates Practically..!!!"
    aws_account: "211125710812"
    #Dynamic variables are values derived from Ansible Facts. These are populated at runtime from the target hosts.
    todays_date: "{{ ansible_facts['date_time']['date'] }}"
    # host_name: "{{ ansible_facts['hostname'] }}"
    # fqdn_name: "{{ ansible_facts['fqdn'] }}"
    # os_family: "{{ ansible_facts['distribution'] }}"
    # os_dest: "{{ ansible_facts['distribution_version'] }}"
  tags:
    - InstallNginx
  tasks:
    - name: Run Apt Update
      shell: apt update
      tags:
        - update
    - name: Install Nginx Server
      apt: >
        name=nginx
        state=present
      tags:
        - install
    - name: Copy the index.j2 Template to index destination folder.
      # This module processes a Jinja2 template.
      template:                                                   
        # src = The source template file on the controller, dest = The destination for the rendered file on the client
        src=/root/Ansible-Testing/playbooks/5.Jinja/index.j2                                                                                                                
        dest=/var/www/html/index.nginx-debian.html                
        owner=root
        group=root
        mode='0644'
      notify: Restart Nginx
      tags:
        - j2
    - name: Copy the style files to destination folder.
      copy: >
        src=/root/Ansible-Testing/playbooks/5.Jinja/style.css
        dest=/var/www/html/style.css
        owner=root
        group=root
        mode=0644
      notify: Restart Nginx
      tags:
        - style
    - name: Copy the javascript files to destination folder.
      copy: >
        src=/root/Ansible-Testing/playbooks/5.Jinja/scorekeeper.js
        dest=/var/www/html/scorekeeper.js
        owner=root
        group=root
        mode=0644
      notify: Restart Nginx
      tags:
        - js

  handlers:
    - name: Restart Nginx
      command: service nginx restart
